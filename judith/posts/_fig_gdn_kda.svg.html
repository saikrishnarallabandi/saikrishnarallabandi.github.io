<figcaption>Inside a single head. Gated DeltaNet scales the whole recurrent state by one number,
so every channel forgets on the same schedule. Kimi Delta Attention gives each channel its own,
so one head can hold a short horizon and a long one at once. <b>The conversion sets every
channel equal</b> — the right-hand panel starts out as the left-hand one, and only training
can pull them apart.</figcaption>
